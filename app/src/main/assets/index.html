<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miauberto Market & POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        miauberto: {
                            dark: '#0f172a',
                            card: '#1e293b',
                            blue: '#2563eb',
                            accent: '#3b82f6',
                            highlight: '#60a5fa'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-miauberto-dark text-slate-100 font-sans min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

    <!-- Header Principal -->
    <header class="bg-miauberto-card border-b border-slate-800 sticky top-0 z-50 shadow-xl">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('explore')">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-xl border-2 border-blue-400 shadow-md">
                    🐱
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wider text-blue-400 flex items-center gap-1.5">
                        MIAUBERTO <span class="text-[10px] bg-blue-900/80 text-blue-200 px-2 py-0.5 rounded-full border border-blue-700 font-mono">MARKET</span>
                    </h1>
                    <p class="text-[11px] text-slate-400">Publicaciones y Punto de Venta</p>
                </div>
            </div>

            <!-- Botones de Navegación -->
            <nav class="flex items-center gap-1 sm:gap-2">
                <button onclick="switchTab('explore')" id="tab-explore-btn" class="nav-tab active px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition">
                    <i class="fa-solid fa-store"></i> <span class="hidden sm:inline">Mercado</span>
                </button>
                <button onclick="switchTab('publish')" id="tab-publish-btn" class="nav-tab px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition">
                    <i class="fa-solid fa-plus-circle"></i> <span>Publicar</span>
                </button>
                <button onclick="switchTab('pos')" id="tab-pos-btn" class="nav-tab px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition relative">
                    <i class="fa-solid fa-cash-register"></i> <span class="hidden sm:inline">Caja / Mis Artículos</span>
                    <span id="cart-badge" class="hidden bg-blue-500 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">0</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- ÁREA DE CONTENIDO -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4">

        <!-- 1. PESTAÑA: EXPLORAR MERCADO (TIPO MERCADO LIBRE) -->
        <section id="tab-explore" class="tab-content space-y-4">
            
            <!-- Barra de Búsqueda y Orden -->
            <div class="bg-miauberto-card p-4 rounded-2xl border border-slate-800 shadow-lg flex flex-col md:flex-row gap-3 justify-between items-center">
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="search-input" oninput="filterAndRenderProducts()" placeholder="Buscar productos, marcas y más..." class="w-full bg-slate-900 border border-slate-700 text-xs rounded-xl pl-9 pr-4 py-2.5 focus:outline-none focus:border-blue-500 text-slate-200">
                </div>
                
                <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                    <label class="text-xs text-slate-400 whitespace-nowrap">Ordenar por:</label>
                    <select id="sort-select" onchange="filterAndRenderProducts()" class="bg-slate-900 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="recent">Más recientes</option>
                        <option value="price-asc">Precio: Menor a Mayor</option>
                        <option value="price-desc">Precio: Mayor a Menor</option>
                    </select>
                </div>
            </div>

            <!-- Filtros de Categoría -->
            <div id="category-bar" class="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
                <!-- Se genera dinámicamente -->
            </div>

            <!-- Rejilla de Productos -->
            <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- Se renderizan los productos -->
            </div>
        </section>


        <!-- 2. PESTAÑA: PUBLICAR ARTÍCULO -->
        <section id="tab-publish" class="tab-content hidden max-w-2xl mx-auto">
            <div class="bg-miauberto-card p-6 rounded-2xl border border-slate-800 shadow-xl">
                <div class="flex items-center gap-3 mb-6 border-b border-slate-800 pb-4">
                    <div class="w-10 h-10 rounded-xl bg-blue-900/50 text-blue-400 border border-blue-700 flex items-center justify-center text-lg">
                        <i class="fa-solid fa-box-open"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-100">Publicar Nuevo Artículo</h2>
                        <p class="text-xs text-slate-400">Añade tu producto al mercado de Miauberto</p>
                    </div>
                </div>

                <form id="publish-form" onsubmit="handlePublish(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Título de la publicación *</label>
                        <input type="text" id="pub-title" required placeholder="Ej. Chaqueta de Mezclilla Miauberto Nøde" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs focus:outline-none focus:border-blue-500">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Precio ($) *</label>
                            <input type="number" step="0.01" min="0" id="pub-price" required placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Stock Disponible *</label>
                            <input type="number" min="1" id="pub-stock" required value="10" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Categoría *</label>
                        <select id="pub-category" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs focus:outline-none focus:border-blue-500 text-slate-200">
                            <option value="Cafetería">☕ Cafetería</option>
                            <option value="Ropa y Mezclilla">🧥 Ropa y Mezclilla</option>
                            <option value="Electrónica">🎧 Electrónica</option>
                            <option value="Accesorios">🎒 Accesorios</option>
                            <option value="Otros">📦 Otros</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Imagen del Producto</label>
                        <div class="flex gap-2 mb-2">
                            <input type="url" id="pub-img-url" placeholder="URL de la imagen (https://...)" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs focus:outline-none focus:border-blue-500">
                            <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl px-4 flex items-center justify-center cursor-pointer text-xs font-medium transition">
                                <i class="fa-solid fa-upload mr-1.5"></i> Subir
                                <input type="file" id="pub-img-file" accept="image/*" onchange="convertImageToBase64(this)" class="hidden">
                            </label>
                        </div>
                        <input type="hidden" id="pub-img-base64">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Descripción</label>
                        <textarea id="pub-description" rows="3" placeholder="Escribe detalles del artículo, estado, características..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs focus:outline-none focus:border-blue-500"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl text-xs tracking-wider uppercase transition shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Publicar Artículo
                    </button>
                </form>
            </div>
        </section>


        <!-- 3. PESTAÑA: MIS PUBLICACIONES / POS DE COBRO -->
        <section id="tab-pos" class="tab-content hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Gestión de Inventario / Publicaciones -->
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-miauberto-card p-4 rounded-2xl border border-slate-800 shadow-xl">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                        <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-blue-400"></i> Mis Publicaciones & Inventario
                        </h2>
                        <div class="flex gap-2">
                            <button onclick="exportJSON()" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700">
                                <i class="fa-solid fa-download"></i> Exportar
                            </button>
                        </div>
                    </div>

                    <div id="my-products-list" class="space-y-3 max-h-[480px] overflow-y-auto pr-1">
                        <!-- Lista de gestión -->
                    </div>
                </div>
            </div>

            <!-- Carrito y Caja Registradora -->
            <div class="space-y-4">
                <div class="bg-miauberto-card p-5 rounded-2xl border border-slate-800 shadow-xl flex flex-col justify-between h-[480px]">
                    <div>
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-3">
                            <h2 class="font-bold text-sm text-slate-200 flex items-center gap-2">
                                <i class="fa-solid fa-cart-shopping text-blue-400"></i> Carrito de Compras
                            </h2>
                            <button onclick="clearCart()" class="text-[10px] text-red-400 hover:text-red-300">Vaciar</button>
                        </div>
                        <div id="cart-items" class="space-y-2 overflow-y-auto max-h-[260px] text-xs pr-1">
                            <!-- Items agregados -->
                        </div>
                    </div>

                    <div class="border-t border-slate-800 pt-3 space-y-3">
                        <div class="space-y-1 text-xs text-slate-400">
                            <div class="flex justify-between">
                                <span>Subtotal</span>
                                <span id="cart-subtotal">$0.00</span>
                            </div>
                            <div class="flex justify-between font-bold text-sm text-slate-100 pt-1 border-t border-slate-800/60">
                                <span>Total</span>
                                <span id="cart-total" class="text-blue-400">$0.00</span>
                            </div>
                        </div>

                        <button onclick="processCheckout()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition text-xs tracking-wider uppercase flex items-center justify-center gap-2">
                            <i class="fa-solid fa-receipt"></i> Completar Compra
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Modal para Detalle de Artículo -->
    <div id="modal-detail" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-miauberto-card border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        // Productos por defecto con la temática de Miauberto
        const initialProducts = [
            { id: '1', title: 'Café Espresso Miauberto Nøde', price: 45.00, category: 'Cafetería', stock: 25, active: true, image: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=400', desc: 'Grano tostado especial selección felina.' },
            { id: '2', title: 'Chaqueta Mezclilla Ruda Custom', price: 850.00, category: 'Ropa y Mezclilla', stock: 5, active: true, image: 'https://images.unsplash.com/photo-1576995853123-5a10305d93c0?w=400', desc: 'Chaqueta de mezclilla estilo Nøde ajustada.' },
            { id: '3', title: 'Audífonos Studio Monitor Dark', price: 1200.00, category: 'Electrónica', stock: 8, active: true, image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400', desc: 'Excelente respuesta de frecuencia para podcasts.' },
            { id: '4', title: 'Taza de Cerámica Nøde Café', price: 150.00, category: 'Accesorios', stock: 30, active: true, image: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400', desc: 'Resistente al calor con grabado mate.' }
        ];

        let products = JSON.parse(localStorage.getItem('miauberto_market_products')) || initialProducts;
        let cart = [];
        let selectedCategory = 'Todas';

        window.onload = function() {
            saveProducts();
            renderCategoryBar();
            filterAndRenderProducts();
            renderMyProducts();
        };

        function saveProducts() {
            localStorage.setItem('miauberto_market_products', JSON.stringify(products));
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active', 'bg-blue-600', 'text-white'));
            
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            const btn = document.getElementById(`tab-${tabId}-btn`);
            btn.classList.add('active', 'bg-blue-600', 'text-white');
        }

        function renderCategoryBar() {
            const categories = ['Todas', 'Cafetería', 'Ropa y Mezclilla', 'Electrónica', 'Accesorios', 'Otros'];
            const bar = document.getElementById('category-bar');
            bar.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border transition ${selectedCategory === cat ? 'bg-blue-600 text-white border-blue-500' : 'bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-700'}">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            selectedCategory = cat;
            renderCategoryBar();
            filterAndRenderProducts();
        }

        function filterAndRenderProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const sort = document.getElementById('sort-select').value;

            let filtered = products.filter(p => {
                const matchesCat = selectedCategory === 'Todas' || p.category === selectedCategory;
                const matchesQuery = p.title.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query);
                return p.active && matchesCat && matchesQuery;
            });

            if (sort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
            if (sort === 'price-desc') filtered.sort((a,b) => b.price - a.price);

            const grid = document.getElementById('products-grid');
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-xs"><i class="fa-solid fa-box-open text-3xl mb-2"></i><p>No se encontraron publicaciones</p></div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="bg-miauberto-card border border-slate-800 hover:border-blue-500 rounded-2xl overflow-hidden shadow-md transition duration-300 flex flex-col justify-between group">
                    <div>
                        <div class="h-36 bg-slate-900 relative overflow-hidden">
                            <img src="${p.image || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${p.title}">
                            <span class="absolute top-2 right-2 bg-slate-900/80 backdrop-blur-md text-[10px] text-blue-300 font-bold px-2 py-0.5 rounded-full border border-slate-700">${p.category}</span>
                        </div>
                        <div class="p-3">
                            <h3 class="font-bold text-xs text-slate-200 line-clamp-2 mb-1">${p.title}</h3>
                            <div class="text-base font-extrabold text-blue-400">$${Number(p.price).toFixed(2)}</div>
                            <p class="text-[10px] text-slate-400 mt-1">Stock: ${p.stock} unids.</p>
                        </div>
                    </div>
                    <div class="p-3 pt-0 flex gap-1.5">
                        <button onclick="openDetail('${p.id}')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 rounded-xl text-[11px] font-semibold transition">Detalles</button>
                        <button onclick="addToCart('${p.id}')" class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-xl text-xs transition"><i class="fa-solid fa-cart-plus"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function convertImageToBase64(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('pub-img-base64').value = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function handlePublish(e) {
            e.preventDefault();
            const title = document.getElementById('pub-title').value.trim();
            const price = parseFloat(document.getElementById('pub-price').value);
            const stock = parseInt(document.getElementById('pub-stock').value);
            const category = document.getElementById('pub-category').value;
            const urlImg = document.getElementById('pub-img-url').value.trim();
            const base64Img = document.getElementById('pub-img-base64').value;
            const desc = document.getElementById('pub-description').value.trim();

            const newProduct = {
                id: Date.now().toString(),
                title,
                price,
                stock,
                category,
                active: true,
                image: base64Img || urlImg || 'https://via.placeholder.com/300?text=Miauberto+Market',
                desc: desc || 'Sin descripción adicional.'
            };

            products.unshift(newProduct);
            saveProducts();
            document.getElementById('publish-form').reset();
            document.getElementById('pub-img-base64').value = '';
            
            filterAndRenderProducts();
            renderMyProducts();
            switchTab('explore');
            alert('¡Artículo publicado con éxito en el Mercado!');
        }

        function renderMyProducts() {
            const container = document.getElementById('my-products-list');
            if (products.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">No tienes artículos registrados.</p>`;
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="flex items-center justify-between bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-xs">
                    <div class="flex items-center space-x-3 flex-1 min-w-0 pr-2">
                        <img src="${p.image}" class="w-10 h-10 object-cover rounded-lg bg-slate-800">
                        <div class="truncate">
                            <h4 class="font-bold text-slate-200 truncate">${p.title}</h4>
                            <span class="text-blue-400 font-semibold">$${p.price.toFixed(2)}</span> &bull; <span class="text-slate-400">Stock: ${p.stock}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleProductStatus('${p.id}')" class="px-2 py-1 rounded-lg text-[10px] font-bold ${p.active ? 'bg-emerald-900/50 text-emerald-400 border border-emerald-700' : 'bg-amber-900/50 text-amber-400 border border-amber-700'}">
                            ${p.active ? 'Pausar' : 'Activar'}
                        </button>
                        <button onclick="deleteProduct('${p.id}')" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function toggleProductStatus(id) {
            const p = products.find(item => item.id === id);
            if (p) {
                p.active = !p.active;
                saveProducts();
                renderMyProducts();
                filterAndRenderProducts();
            }
        }

        function deleteProduct(id) {
            if (confirm('¿Eliminar esta publicación del inventario?')) {
                products = products.filter(p => p.id !== id);
                saveProducts();
                renderMyProducts();
                filterAndRenderProducts();
            }
        }

        function addToCart(id) {
            const p = products.find(item => item.id === id);
            if (!p || p.stock <= 0) {
                alert('Producto agotado');
                return;
            }

            const item = cart.find(c => c.id === id);
            if (item) {
                if (item.qty < p.stock) item.qty++;
            } else {
                cart.push({ id: p.id, title: p.title, price: p.price, qty: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const container = document.getElementById('cart-items');
            const badge = document.getElementById('cart-badge');
            const totalQty = cart.reduce((acc, i) => acc + i.qty, 0);

            if (totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center py-10">El carrito está vacío</p>`;
                document.getElementById('cart-subtotal').innerText = '$0.00';
                document.getElementById('cart-total').innerText = '$0.00';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map(item => {
                const sub = item.price * item.qty;
                total += sub;
                return `
                    <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                        <div class="flex-1 pr-2">
                            <div class="font-medium text-slate-200 line-clamp-1">${item.title}</div>
                            <div class="text-blue-400">$${item.price.toFixed(2)} x ${item.qty}</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-200">$${sub.toFixed(2)}</span>
                            <button onclick="removeFromCart('${item.id}')" class="text-red-400 font-bold px-1">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cart-subtotal').innerText = `$${total.toFixed(2)}`;
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            updateCart();
        }

        function clearCart() {
            cart = [];
            updateCart();
        }

        function processCheckout() {
            if (cart.length === 0) {
                alert('Agrega artículos al carrito antes de cobrar.');
                return;
            }

            cart.forEach(item => {
                const p = products.find(prod => prod.id === item.id);
                if (p) p.stock -= item.qty;
            });

            saveProducts();
            clearCart();
            renderMyProducts();
            filterAndRenderProducts();
            alert('¡Venta completada con éxito por Miauberto Market!');
        }

        function openDetail(id) {
            const p = products.find(item => item.id === id);
            if (!p) return;

            document.getElementById('modal-content').innerHTML = `
                <img src="${p.image}" class="w-full h-48 object-cover rounded-xl bg-slate-900 mb-4 border border-slate-800">
                <span class="bg-blue-900/60 text-blue-300 text-[10px] font-bold px-2.5 py-1 rounded-full border border-blue-700 uppercase tracking-wider">${p.category}</span>
                <h3 class="text-lg font-bold text-slate-100 mt-2 mb-1">${p.title}</h3>
                <p class="text-slate-400 text-xs mb-4 leading-relaxed">${p.desc}</p>
                <div class="flex justify-between items-center border-t border-slate-800 pt-4">
                    <span class="text-xl font-extrabold text-blue-400">$${p.price.toFixed(2)}</span>
                    <button onclick="addToCart('${p.id}'); closeModal();" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition">
                        Agregar al Carrito
                    </button>
                </div>
            `;
            document.getElementById('modal-detail').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-detail').classList.add('hidden');
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(products, null, 2));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", `miauberto_productos_${Date.now()}.json`);
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
        }
    </script>
</body>
</html>
