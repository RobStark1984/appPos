<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miauberto POS - Punto de Venta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        miauberto: {
                            dark: '#121824',
                            card: '#1e293b',
                            blue: '#3b82f6',
                            accent: '#60a5fa',
                            coffee: '#78350f'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-miauberto-dark text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header de Miauberto POS -->
    <header class="bg-miauberto-card border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xl border-2 border-blue-400 shadow-md">
                    🐱
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wider text-blue-400 flex items-center gap-2">
                        MIAUBERTO <span class="text-xs bg-blue-900 text-blue-200 px-2 py-0.5 rounded-full border border-blue-700">POS NØDE</span>
                    </h1>
                    <p class="text-xs text-slate-400">Control de Caja e Inventario GitHub</p>
                </div>
            </div>
            <button onclick="sincronizarRepo()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                <span>🔄</span> Sincronizar
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Sección de Productos / Catálogo -->
        <section class="md:col-span-2 space-y-4">
            <div class="bg-miauberto-card p-4 rounded-xl border border-slate-800 shadow-md">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-semibold text-sm text-slate-300">Catálogo de Productos</h2>
                    <input type="text" id="buscar" placeholder="Buscar producto..." onkeyup="filtrarProductos()" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500 w-44">
                </div>
                <div id="grid-productos" class="grid grid-cols-2 gap-3">
                    <!-- Productos dinámicos cargados por JS -->
                    <div onclick="agregarAlCarrito('Café Expreso Miauberto', 45)" class="bg-slate-900/60 p-3 rounded-lg border border-slate-800 hover:border-blue-500 cursor-pointer transition">
                        <div class="text-2xl mb-1">☕</div>
                        <div class="font-bold text-sm">Café Expreso</div>
                        <div class="text-xs text-blue-400 font-semibold">$45.00</div>
                    </div>
                    <div onclick="agregarAlCarrito('Hamburguesa Nøde', 120)" class="bg-slate-900/60 p-3 rounded-lg border border-slate-800 hover:border-blue-500 cursor-pointer transition">
                        <div class="text-2xl mb-1">🍔</div>
                        <div class="font-bold text-sm">Hamburguesa Nøde</div>
                        <div class="text-xs text-blue-400 font-semibold">$120.00</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sección de Caja y Ticket -->
        <section class="space-y-4">
            <div class="bg-miauberto-card p-4 rounded-xl border border-slate-800 shadow-md flex flex-col justify-between h-[380px]">
                <div>
                    <h2 class="font-semibold text-sm text-slate-300 mb-3 border-b border-slate-800 pb-2">Ticket Actual</h2>
                    <div id="lista-carrito" class="space-y-2 overflow-y-auto max-h-44 text-xs pr-1">
                        <p class="text-slate-500 text-center py-6">El carrito está vacío</p>
                    </div>
                </div>

                <div class="border-t border-slate-800 pt-3 space-y-2">
                    <div class="flex justify-between text-sm font-bold">
                        <span>Total:</span>
                        <span id="total-pagar" class="text-blue-400">$0.00</span>
                    </div>
                    <button onclick="cobrar()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg shadow transition text-xs tracking-wide">
                        COBRAR Y REGISTRAR
                    </button>
                </div>
            </div>
        </section>

    </main>

    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800 mt-auto">
        Miauberto Nøde Systems &bull; Compilado vía GitHub Actions
    </footer>

    <script>
        let carrito = [];

        function agregarAlCarrito(nombre, precio) {
            let item = carrito.find(i => i.name === nombre);
            if (item) {
                item.qty++;
            } else {
                carrito.push({ name: nombre, price: precio, qty: 1 });
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            let contenedor = document.getElementById('lista-carrito');
            let totalSpan = document.getElementById('total-pagar');
            
            if (carrito.length === 0) {
                contenedor.innerHTML = '<p class="text-slate-500 text-center py-6">El carrito está vacío</p>';
                totalSpan.innerText = '$0.00';
                return;
            }

            let html = '';
            let total = 0;
            carrito.forEach((item, index) => {
                let sub = item.price * item.qty;
                total += sub;
                html += `
                    <div class="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                        <div>
                            <div class="font-medium">${item.name}</div>
                            <div class="text-slate-400">$${item.price} x ${item.qty}</div>
                        </div>
                        <button onclick="eliminarItem(${index})" class="text-red-400 hover:text-red-300 font-bold px-1">✕</button>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
            totalSpan.innerText = `$${total.toFixed(2)}`;
        }

        function eliminarItem(index) {
            carrito.splice(index, 1);
            actualizarCarrito();
        }

        function cobrar() {
            if (carrito.length === 0) {
                alert('Agrega productos antes de cobrar.');
                return;
            }
            alert('¡Venta registrada con éxito por Miauberto!');
            carrito = [];
            actualizarCarrito();
        }

        function sincronizarRepo() {
            alert('Sincronizando inventario con repositorio GitHub...');
        }

        function filtrarProductos() {
            // Lógica de filtrado rápido
        }
    </script>
</body>
</html>
