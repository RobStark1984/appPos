name: Build Android App Bundle & APK (Play Store)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    # 1. Compila el archivo APK de depuración
    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    # 2. Compila el archivo AAB (Android App Bundle) para Google Play Store
    - name: Build Release Bundle (AAB)
      run: gradle bundleRelease --stacktrace

    # 3. Sube el APK a la sección de Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Miauberto-POS-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    # 4. Sube el AAB a la sección de Artifacts
    - name: Upload AAB Artifact (Play Store Ready)
      uses: actions/upload-artifact@v4
      with:
        name: Miauberto-POS-Release-AAB
        path: app/build/outputs/bundle/release/app-release.aab
